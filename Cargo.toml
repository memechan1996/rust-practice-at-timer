[package]
name = "at-timer"
version = "0.1.0"
edition = "2024"

[dependencies]
inquire = "0.9.4"
inquire-derive = "0.9.4"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"]}
serde_json = "1.0"
rand = "0.8"
chrono = "0.4"

[build]
target = "x86_64-pc-windows-gnu"